name: quberbill

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: quberbill-app:latest
    networks:
      - frappe_network
    restart: unless-stopped
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-admin}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-admin}
    depends_on:
      configurator:
        condition: service_completed_successfully

  configurator:
    build:
      context: .
      dockerfile: Dockerfile
    image: quberbill-app:latest
    networks:
      - frappe_network
    restart: "no"
    entrypoint:
      - bash
      - -c
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
        cd sites && ln -sfn frontend quberbill.mooo.com 2>/dev/null || true;
        cd ..;
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  create-site:
    build:
      context: .
      dockerfile: Dockerfile
    image: quberbill-app:latest
    networks:
      - frappe_network
    restart: "no"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    entrypoint:
      - bash
      - -c
    command:
      - >
        wait-for-it -t 120 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        export start=`date +%s`;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
          echo "Waiting for sites/common_site_config.json to be created";
          sleep 5;
          if (( `date +%s`-start > 120 )); then
            echo "could not find sites/common_site_config.json with required keys";
            exit 1
          fi
        done;
        echo "sites/common_site_config.json found";
        SITE=$${SITE_NAME:-frontend};
        echo "$$SITE" > sites/currentsite.txt;
        cd sites && ln -sfn "$$SITE" quberbill.mooo.com 2>/dev/null || true;
        cd ..;
        mkdir -p sites/assets/bharat_business sites/assets/erpnext/images sites/assets/frappe/images 2>/dev/null || true;
        cp -r apps/bharat_business/bharat_business/public/* sites/assets/bharat_business/ 2>/dev/null || true;
        cp apps/bharat_business/bharat_business/public/images/quberbill-icon.svg sites/assets/erpnext/images/erpnext-logo.svg 2>/dev/null || true;
        cp apps/bharat_business/bharat_business/public/images/quberbill-icon.svg sites/assets/erpnext/images/erp-icon.svg 2>/dev/null || true;
        cp apps/bharat_business/bharat_business/public/images/quberbill-icon.svg sites/assets/frappe/images/frappe-framework-logo.svg 2>/dev/null || true;
        cp apps/bharat_business/bharat_business/public/images/quberbill-icon.png sites/assets/erpnext/images/erpnext-icon.png 2>/dev/null || true;
        cp apps/bharat_business/bharat_business/public/images/quberbill-icon.png sites/assets/frappe/images/frappe-icon.png 2>/dev/null || true;
        sed -i "s/country\.replace/(country or 'India')\.replace/g" apps/erpnext/erpnext/setup/setup_wizard/operations/install_fixtures.py 2>/dev/null || true;
        sed -i "s/fixtures\.install(args\.get(\"country\"))/fixtures.install(args.get(\"country\") or \"India\")/g" apps/erpnext/erpnext/setup/setup_wizard/setup_wizard.py 2>/dev/null || true;
        if [ -d "sites/$$SITE" ]; then
          echo "Site $$SITE already exists, running migrations";
          bench --site $$SITE set-maintenance-mode off 2>/dev/null || true;
          bench --site $$SITE uninstall-app india_compliance --yes 2>/dev/null || true;
          bench --site $$SITE migrate --skip-failing 2>/dev/null || bench --site $$SITE migrate 2>/dev/null || true;
          bench --site $$SITE set-maintenance-mode off 2>/dev/null || true;
          bench --site $$SITE execute bharat_business.setup.install._setup_branding 2>/dev/null || true;
          bench --site $$SITE execute frappe.db.set_single_value --args "['Website Settings', 'disable_signup', 0]" 2>/dev/null || true;
        else
          echo "Creating site $$SITE";
          INSTALL_ARGS="--install-app erpnext";
          if [ -d "apps/bharat_business" ]; then
            INSTALL_ARGS="$$INSTALL_ARGS --install-app bharat_business";
          fi;
          bench new-site \
            --mariadb-user-host-login-scope='%' \
            --admin-password=$${ADMIN_PASSWORD:-admin} \
            --db-root-username=root \
            --db-root-password=$${MARIADB_ROOT_PASSWORD:-admin} \
            $$INSTALL_ARGS \
            --set-default $$SITE;
          bench --site $$SITE execute bharat_business.setup.install._setup_branding 2>/dev/null || true;
          bench --site $$SITE execute frappe.db.set_single_value --args "['Website Settings', 'disable_signup', 0]";
        fi;
        cd sites && ln -sfn "$$SITE" quberbill.mooo.com 2>/dev/null || true;
    environment:
      SITE_NAME: ${SITE_NAME:-frontend}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-admin}
    depends_on:
      configurator:
        condition: service_completed_successfully

  db:
    image: mariadb:11.8
    networks:
      - frappe_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --innodb-snapshot-isolation=OFF
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-admin}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-admin}
    volumes:
      - db-data:/var/lib/mysql

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: quberbill-app:latest
    networks:
      - frappe_network
    depends_on:
      - websocket
      - backend
    restart: unless-stopped
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: ${FRAPPE_SITE_NAME_HEADER:-quberbill.mooo.com}
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    ports:
      - "${FRONTEND_PORT:-8082}:8080"
    expose:
      - "8080"

  queue-long:
    build:
      context: .
      dockerfile: Dockerfile
    image: quberbill-app:latest
    networks:
      - frappe_network
    restart: unless-stopped
    command:
      - bench
      - worker
      - --queue
      - long,default,short
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    depends_on:
      configurator:
        condition: service_completed_successfully

  queue-short:
    build:
      context: .
      dockerfile: Dockerfile
    image: quberbill-app:latest
    networks:
      - frappe_network
    restart: unless-stopped
    command:
      - bench
      - worker
      - --queue
      - short,default
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    depends_on:
      configurator:
        condition: service_completed_successfully

  redis-queue:
    image: redis:6.2-alpine
    networks:
      - frappe_network
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data

  redis-cache:
    image: redis:6.2-alpine
    networks:
      - frappe_network
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: quberbill-app:latest
    networks:
      - frappe_network
    restart: unless-stopped
    command:
      - bench
      - schedule
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully

  websocket:
    build:
      context: .
      dockerfile: Dockerfile
    image: quberbill-app:latest
    networks:
      - frappe_network
    restart: unless-stopped
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully

volumes:
  db-data:
  redis-queue-data:
  sites:
  logs:

networks:
  frappe_network:
    driver: bridge
