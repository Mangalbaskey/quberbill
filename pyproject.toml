[project]
name = "bharat_business"
authors = [
    { name = "QuberBill", email = "support@quberbill.com" }
]
description = "QuberBill — Smart Small Business Operating Platform & Billing System built on Frappe + ERPNext"
readme = "README.md"
dynamic = ["version"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
